    # Sample training data (from training_manager.py and enhanced_fine_tuner.py)
    sample_data:
      book:
        - question: "What is benzene?"
          answer: "Benzene is an aromatic hydrocarbon with formula C6H6."
        - question: "How are alkanes named?"
          answer: "Alkanes are named using IUPAC nomenclature."
      paper:
        - question: "Who discovered benzene structure?"
          answer: "Kekulé proposed the benzene ring structure in 1865."
        - question: "What was the first alkane synthesis?"
          answer: "Early alkane synthesis used Wurtz reaction."
      integrated:
        - question: "How does Kekulé benzene relate to modern understanding?"
          answer: "Kekulé ring was foundational but modern theory includes resonance and delocalization."

