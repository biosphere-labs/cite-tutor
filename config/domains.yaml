# Domain-specific configuration for sci-tutor
# This file contains all domain-specific patterns, keywords, and configurations
# that were previously hardcoded in the source files

# Available domains
available_domains:
  - chemistry
  - physics
  - mathematics
  - biology
  - engineering

# Default domain (used if not specified)
default_domain: chemistry

# Domain configurations
