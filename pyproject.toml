[project]
name = "cite-tutor"
version = "0.1.0"
description = "AI-powered academic research assistant that processes PDF books and papers"
authors = [
    {name = "Justin Robinson", email = "justin.g.robinson@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.1",
    "transformers>=4.30.2",
    "datasets>=2.14.0",
    "accelerate>=0.21.0",
    "bitsandbytes>=0.41.0",
    "peft>=0.4.0",
    "PyMuPDF>=1.23.0",
    "pytesseract>=0.3.10",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.2",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cite-tutor = "cite_tutor.main:main"
process-pdf = "cite_tutor.pdf_processor:main"
extract-citations = "cite_tutor.citation_extractor:main"
fine-tune = "cite_tutor.enhanced_fine_tuner:main"
start-rag = "cite_tutor.rag_system:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cite_tutor"]
